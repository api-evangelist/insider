- name: Insider One Unification API
  description: >-
    The Unified Customer Database. Upsert user profiles, attributes and behavioural events, read profiles
    back with a sparse fieldset, manage identifiers, export raw data, and run the GDPR delete/anonymize
    operations. Profiles are addressed by customer-owned identifiers (email, phone, uuid, custom)
    — there is no Insider-issued user id.
  humanURL: https://academy.insiderone.com/docs/ucd-user-data-apis-overview
  baseURL: https://unification.useinsider.com
