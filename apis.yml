aid: insider
name: Insider
description: >-
  Insider (rebranded Insider One; useinsider.com now redirects to insiderone.com) is an AI-native
  customer engagement and personalization platform used by 2,000+ global brands. It unifies a Customer
  Data Platform, cross-channel journey orchestration (Architect), personalization, predictive segmentation,
  product discovery (Eureka) and behavioural analytics across Web, Email, SMS/RCS, WhatsApp, Web Push,
  Mobile App, Site Search, InStory and conversational CX. Its developer surface is substantial and
  public: 113 REST operations across 18 hosts, published as a public Postman collection at developers.insiderone.com,
  covering the Unified Customer Database, consent and subscription management, transactional email/SMS/WhatsApp,
  web and app push, iOS Live Activities, OTP verification, product catalog, recommendations, Eureka
  search and campaign and journey analytics. Insider One also ships a first-party remote MCP server
  at mcp.insiderone.com with 35 OAuth-scoped tools, an llms.txt indexing ~2,800 markdown-retrievable
  doc pages, and an account-generated Agent Skill (SKILL.md) for Claude Code. It publishes per-endpoint
  rate limits, a cross-API status-and-error-code reference, and SOC 2 / ISO 27001 / ISO 27701 / CSA
  STAR attestations — but no OpenAPI, no pricing, no status page and no deprecation policy.
url: https://raw.githubusercontent.com/api-evangelist/insider/refs/heads/main/apis.yml
