apis:
- name: Insider One MCP Server
  description: >-
    First-party remote Model Context Protocol server exposing 35 tools across Email, SMS, WhatsApp, Web
    Push, Mobile App and Architect — 28 read-only and 7 that create drafts for human review. Authenticated
    with OAuth 2.0 credentials generated in the InOne panel, with per-channel scopes. Listed in the Claude
    Connectors directory. It never sends, schedules or publishes, and cannot modify customer data or journeys.
  humanURL: https://academy.insiderone.com/docs/set-up-insider-one-mcp
  baseURL: https://mcp.insiderone.com/mcp
