aid: insider
name: Insider
description: >-
  Insider (rebranded Insider One, useinsider.com now redirects to insiderone.com)
  is an AI-native customer engagement and personalization platform used by 2,000+
  global brands. It unifies a Customer Data Platform (CDP), cross-channel journey
  orchestration (Architect), personalization, predictive segmentation, and
  behavioral analytics, delivering across Web, Email, SMS/RCS, WhatsApp, Web Push,
  Mobile App, Site Search, InStory and conversational CX. For developers it exposes
  a Unified Customer Database via the Upsert User Data API (POST
  unification.useinsider.com/api/user/v1/upsert, authenticated with X-REQUEST-TOKEN
  and X-PARTNER-NAME headers), a Product Catalog API, Web and Mobile (iOS, Android,
  React Native, Flutter, Cordova) SDKs, and an outbound "Call an API" journey
  channel. Recognized by Gartner and Forrester as a leader in personalization
  engines, CDP and omnichannel marketing platforms.
