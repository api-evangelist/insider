notes: >-
  Insider One's first-party libraries are CLIENT SDKs — mobile, web and integration nodes. There is
  no server-side SDK for the REST estate in any language: the 113 published REST operations are
  called over plain HTTP, and Insider One's own onboarding path for them is the Postman collection.
  Every mobile SDK is actively released — Android 16.0.9 (2026-08-04), iOS 15.1.2 (2026-08-04),
  React Native 8.1.0 (2026-08-05), Flutter 5.1.0 (2026-08-10) — so nothing here is abandoned except
  the Expo runtime package, whose last npm release was 2020.
server_sdks: none

