gaps:
- No server-side SDK in any language for the REST estate.
- The Android SDK is not on Maven Central under com.useinsider, so its distribution cannot be
  verified or pinned from a public registry.
- iOS ships two disagreeing version lines (SPM tag 1.9.2 vs product 15.1.2).
