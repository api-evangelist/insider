summary: >-
  Insider One publishes dated, per-release changelogs for its six client SDKs and NOTHING for the
  REST APIs. There is no API changelog, no release-notes feed and no RSS: the only way to learn that
  a REST endpoint changed is to notice it in the reference. The SDK changelogs are genuinely good —
  semver, an explicit release date on each entry, and New Features / Updates / Fixes sections — and
  they are shipping monthly.
scheme: semver
