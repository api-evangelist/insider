summary: >-
  Insider One publishes a single cross-API status-and-error-code reference covering 2XX, 4XX and 5XX
  with sample payloads. It is unusually complete for a marketing platform — roughly 95 documented
  responses — but it is NOT a normalized error registry: the docs themselves warn "the responses vary
  depending on the APIs" and there are at least SIX different error-envelope shapes in use across the
  hosts. There is no application/problem+json, no stable machine error-code namespace shared across
  APIs, and no per-operation error mapping. An agent must branch on envelope shape before it can read
  an error.

envelopes:
- id: success-message
  shape: '{"success": false, "message": "<human text>"}'
  used_by: [catalog.api.useinsider.com, unification.useinsider.com, analytics.api.useinsider.com]
  machine_code: false
- id: bare-error-string
  shape: '{"error": "<human text>"}'
  used_by: [unification.useinsider.com, mobile.api.useinsider.com, web-push.api.useinsider.com]
  machine_code: false
- id: error-code-message
  shape: '{"error": "<snake_case_code>", "message": "<human text>"}'
  used_by: [mobile.useinsider.com]
  machine_code: true
  note: The closest thing Insider One has to a stable machine-readable error code namespace.
- id: errors-array-objects
  shape: '{"errors": [{"message": "<text>", "field": "<field>"}]}'
  used_by: [sms.useinsider.com, verify.useinsider.com, whatsapp.useinsider.com]
  machine_code: false
  note: Carries a field pointer, which the other envelopes do not.
- id: errors-array-strings
  shape: '{"errors": ["Missing ''subject'' parameter"], "message": "bad-request", "status": 400}'
  used_by: [mail.useinsider.com]
  machine_code: false
- id: status-data-validations
  shape: '{"status": "Invalid|BusinessException|Error", "data": null, "error": {"code": "...", "message": "..."}, "validations": [...]}'
  used_by: [ineureka.api.useinsider.com]
  machine_code: true
- id: meta-error-passthrough
  shape: '{"error": {"message": "(#130429) Rate limit hit", "type": "OAuthException", "code": 130429, "fbtrace_id": "...", "error_data": {...}}}'
  used_by: [whatsapp.useinsider.com, gw.useinsider.com]
  machine_code: true
  note: >-
    WhatsApp errors are Meta Cloud API errors forwarded verbatim to your webhook, including numeric
    Meta error codes and fbtrace_id. error_data is optional — rely on code + message.

request_id_header: null
request_id_note: >-
  No request-id / trace header is documented on Insider One responses. For WhatsApp sends the
  response carries a "key" (Insider-created message tracking key) that appears in every subsequent
  webhook event for that message — that is the only end-to-end correlation identifier published.

