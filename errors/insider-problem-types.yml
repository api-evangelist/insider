gaps:
- No RFC 9457 problem+json anywhere.
- Six incompatible error envelopes across hosts; no shared machine-readable code namespace.
- Errors are documented globally, not per operation, so an OpenAPI response mapping cannot be derived
  reliably beyond the throttling case.
- No request-id or trace header on responses.
