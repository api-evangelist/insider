integrity_rules:
- Identifier values are globally unique; reassigning one requires deleting it from the other profile.
- A profile cannot be left with zero identifiers.
- Custom attributes and custom event params must be nested under `custom`; root placement silently
  mismaps the data (Insider One calls this out as the most consequential integration mistake).
- Catalog upserts are keyed on item_id + locale, so a product exists once per locale.

