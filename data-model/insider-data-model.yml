summary: >-
  Insider One's data model has no server-generated primary keys in its public API. Everything hangs
  off the User Profile, and the User Profile is addressed by a bag of IDENTIFIERS the customer owns
  (email, phone, uuid, plus custom identifiers) rather than by an Insider ID. Identity resolution —
  which identifier wins when two collide — is a panel setting, not an API parameter, which is why so
  many documented 400s are identifier-collision errors. The second root is the Product (item_id +
  locale). Events bind the two together.
key_style: customer-owned natural keys
id_prefixes: none
server_generated_ids:
- {name: campaign_id, entity: Campaign, seen_in: 'campaign create 201 response, analytics requests'}
- {name: builder_id, entity: EmailCampaign, seen_in: 'campaign create 201 response'}
- {name: journeyId, entity: Journey, seen_in: 'architect analytics path parameter'}
- {name: segment_id, entity: Segment, seen_in: 'raw export request'}
- {name: key, entity: WhatsAppMessage, seen_in: 'send response + every webhook event', note: 'tracking key, the only cross-surface correlation id'}

