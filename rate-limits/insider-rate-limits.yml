limit_count: 59
mcp_note: >-
  Insider One states that existing API rate limits apply to calls made through the MCP server, so an
  agent inherits the per-endpoint budget of whichever REST operation backs the tool it invoked.
gaps:
- No quota headers on successful responses; a client cannot see remaining budget.
- No published limits for the gw.useinsider.com OAuth 2.0 WhatsApp v2 endpoints or the Eureka
  search/event-collection hosts.
