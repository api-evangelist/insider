description: >-
  Insider One publishes a full per-endpoint rate-limit table covering every API host. Limits are
  enforced per API key, with several endpoints sharing a pooled limit across an account or across all
  endpoints of an API. Exhaustion returns 429 Too Many Requests; exponential backoff is the
  documented remedy.
scope_model:
  default: per-api-key
  exceptions:
  - Upsert User Data and Delete User Attribute share one pooled 25,000 req/min budget.
  - All Catalog API endpoints share one pooled 60 req/min budget.
  - All Recommendation API endpoints share one pooled 1,000 req/min budget.
  - Web Push statistics endpoints are limited "in aggregate" at 30 req/min.
headers:
  retry_after: Retry-After
  retry_after_note: >-
    Insider One documents Retry-After "in seconds" as sometimes present on a 429. It publishes NO
    X-RateLimit-*/RateLimit-* quota headers, so a client cannot read remaining budget before
    exhaustion — the only runtime signal is the 429 itself plus an optional Retry-After.
  ratelimit_headers_published: false
responseCodes:
  throttled: 429
  throttled_alt: 403
  throttled_alt_note: >-
    The status-code reference also documents a "403 Request Limit Exceeded" response, so throttling
    is not uniformly signalled as 429 across every host.
backoff: exponential backoff, documented
raise_limits: >-
  Higher limits on transactional send endpoints (mail /mail/v1/send, sms /v1/send and
  /v1/sendMultipleMessage, whatsapp /v1/send) can be configured on request by contacting Insider One.
throughput_note: >-
  Request rate limits are separate from Messaging Per Second (MPS), the rate at which the platform
  actually delivers to the carrier/provider. A single accepted request may carry many messages;
  over-rate traffic is queued and dispatched in the next interval rather than dropped, with
  automation and confirmation messages prioritised ahead of campaign traffic. A 2xx on a send
  endpoint means accepted-and-queued, not delivered.

