        },

        {

        "locale": "fr",

        "text": "Votre code de vérification {brandName} est: {code}"

        },

        {

        "locale": "it",

        "text": "Il tuo codice di verifica {brandName} è: {code}"

        },

        {

        "locale": "ja",

        "text": "あなたの{brandName}確認コードは: {code}です"

        },

        {

        "locale": "nl",

        "text": "Uw {brandName} verificatiecode is: {code}"

        },

        {

