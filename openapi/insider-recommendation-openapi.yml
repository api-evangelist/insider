        \ be excluded\nInteger\nNo (Can be used only with userId)\n\nexcludePurchaseItem\n100\nHow many purchased\
        \ products should be excluded\nInteger\nNo (Can be used only with userId)\n\nhp\nfalse\nMakes affinities\
        \ affect products of the response. The default is false.\nBoolean\nNo\n\ndayLimit\n2\nIf FMT is published_time,\
        \ it adds a day limit filter. The default is 2.\nInteger\nNo\n\nproductId\nABC123CBA\nCurrent product ID\n\
        String\nNo\n\nSample Request\nThe sample below displays a request to User Engagement, a personalized recommendation\
        \ algorithm that analyzes the current user’s most recent interactions (such as product views, clicks, or\
        \ cart actions) to deliver highly relevant product suggestions in real time.\n\nhttps://recommendation.api.useinsider.com/v2/user-engagement?locale={locale}&userId={userId}&partnerName={partnerName}\n\
        \nSample Response\n{\n    \"success\": true,\n    \"total\": 10,\n    \"types\": {\n        \"ue\": 10\n\
        \    },\n    \"data\": [\n        \"649517_49890\",\n        \"568334_49053\",\n        \"639714_49677\"\
        ,\n        \"651579_3255\",\n        \"614493_50094\",\n        \"614508_49668\",\n        \"568334_47380\"\
        ,\n        \"641331_49914\",\n        \"621390_3255\",\n        \"646581_48990\"\n    ]\n}\n\nFallback Algorithms\n\
        If the current user has not visited two or more products, or if user engagement recommendations are filtered\
        \ out, recommendations from the following algorithms are returned in sequence:\n\nPurchased Together\n\n\
        Most Popular Items"
      security:
      - RequestToken: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/viewed-together:
    get:
      operationId: viewedTogether
      summary: Viewed Together
      tags:
      - Algorithm Descriptions
      description: "The Viewed Together algorithm recommends items by identifying similar products users have viewed.\
        \ It generates recommendations based on products viewed in the same sessions and in the same locale over\
        \ the past 30 days. After generating recommendations, the Viewed Together algorithm orders the results by\
        \ visit frequency (popularity). Thus, users can find complementary or substitute products for the one they\
        \ are currently viewing. This increases discovery rates and the likelihood of grabbing users’ attention\
        \ when they don’t have a target product. This type of algorithm works best on product pages.\n\nEndpoint\n\
        \nGET https://recommendation.api.useinsider.com/v2/viewed-together\n\nQuery Parameters\n\nParameter\nSample\
        \ Value\nDescription\nData Type\nRequired\n\npartnerName\nmybrand\nPartner Identifier assigned by Insider\
        \ One. You can use PartnerID as well.\nString\nYes\n\nlocale\nus_US\nLocale of the requested product catalog\n\
        String\nYes\n\nplatform\nweb\nRequested platform. Web comes by default.\nEnum\nNo\n\ncurrency\nUSD\nRequested\
        \ currency of the products. If no value is set, the default currency in your settings is used.\nString\n\
        No\n\nproductId\nABC0123\nBase product ID\nString\nYes\n\nsize\n50\nRequired number of items in response.\
        \ Valid values are 0 to 100.\nInteger\nNo\n\ncategoryList\n[“Clothes”, “Skirts”]\nCategory filter of the\
        \ products\nArray (of string)\nNo\n\nfilter\n\nSmart Recommender filtering. There can be more than one filter\
        \ parameter.\nString\nNo\n\ndetails\ntrue\nAdds details to the products of the response\nBoolean\nNo\n\n\
        shuffle\nfalse\nShuffles the products of the response\nBoolean\nNo\n\ngetGroupProducts\nfalse\nShows variant\
        \ products under the products of the response\nBoolean\nNo\n\ngroupProductsFields\n\nAdds these fields to\
        \ the variant products’ details\nString\nNo\n\nexcludeVariants\ntrue\nExclude variants from the response\n\
        Boolean\nNo\n\nuserId\na1b2c3d4\nUser identifier that is assigned by Insider One\nString\nNo\n\nexcludeViewDay\n\
        30\nAfter how many days should viewed products be excluded\nInteger\nNo (Can be used only with userId)\n\
        \nexcludeViewItem\n100\nHow many viewed products should be excluded\nInteger\nNo (Can be used only with\
        \ userId)\n\nexcludePurchaseDay\n30\nAfter how many days should purchased products be excluded\nInteger\n\
        No (Can be used only with userId)\n\nexcludePurchaseItem\n100\nHow many purchased products should be excluded\n\
        Integer\nNo (Can be used only with userId)\n\nhp\nfalse\nMakes affinities affect products of the response\n\
        Boolean\nNo\n\nSample Request\nThe sample below displays a request to Viewed Together, a recommendation\
        \ algorithm that suggests items commonly viewed alongside the same product by other users.\n\nhttps://recommendation.api.useinsider.com/v2/viewed-together?locale={Locale}&productId={ProductID}¤cy={Currenct}&partnerName={PartnerName}\n\
        \nSample Response\n{\n    \"success\": true,\n    \"total\": 10,\n    \"types\": {\n        \"mvop\": 10\n\
        \    },\n    \"data\": [\n        \"QAZ-7890\",\n        \"XYZ-1234\",\n        \"QAZ-7899\",\n        \"\
        XYZ-1233\",\n        \"QAZ-7898\",\n        \"XYZ-1243\",\n        \"QAZ-7891\",\n        \"XYZ-1223\",\n\
        \        \"QAZ-7892\",\n        \"XYZ-1342\"\n    ]\n}\n\nFallback Algorithms\nIf the products from Viewed\
        \ Together are not enough to fill the response data, some fallback algorithms below fill it:\n\nMost viewed\
        \ of the category\n\nMost viewed of the category without excluding the right-most item in the categoryList\n\
        \nMost viewed of the Partner"
      security:
      - RequestToken: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/visually-similar:
    get:
      operationId: visuallySimilarProducts
      summary: Visually Similar Products
      tags:
      - Algorithm Descriptions
      description: "The Visually Similar Products algorithm surfaces products that look like the one the shopper\
        \ is currently viewing. It compares product images using a multimodal AI model, refined with light product\
        \ metadata, and performs optimally on category and product detail pages in visually-driven verticals such\
        \ as fashion and home décor.\n\n<p >Insider One processes your product catalog images to generate recommendation\
        \ results.</p> \n\nEndpoint\nGET https://recommendation.api.useinsider.com/v2/visually-similar\n\nQuery\
        \ Parameters\n\nParameter\nSample Value\nDescription\nData Type\nRequired\n\npartnerName\nmybrand\nPartner\
        \ Identifier assigned by Insider One. You can use PartnerID as well.\nString\nYes\n\nlocale\nus_US\nLocale\
        \ of requested product catalog\nString\nYes\n\nproductId\n1068\nThe reference product for which the complement\
        \ is computed\nString\nYes\n\ncurrency\nUSD\nProduct currency. If no value is set, the default currency\
        \ in your settings is used.\nString\nNo\n\nsize\n10\nResponse items. Valid values are 0 to 100.\nInteger\n\
        No\n\ncategoryList\n[“Clothes”]\nCategory filter of the products\nArray\nNo\n\nuserId\na1b2c3d4\nUser identifier;\
        \ enables personalization boosts when provided\nString\nNo\n\nplatform\nweb\nRequested platform (default:\
        \ web)\nEnum\nNo\n\ndetails\ntrue\nAdds details to the products of the response\nBoolean\nNo\n\nexcludeVariants\n\
        true\nHides color/size variants of the same base product\nBoolean\nNo\n\nshuffle\nfalse\nShuffles the products\
        \ of the response\nBoolean\nNo\n\nfilter\n[in_stock][=][true]\nRestricts results by fields such as price,\
        \ brand, color, gender, in_stock, or category\nString\nNo\n\nhp\ntrue\nHyper-personalization flag. Re-ranks\
        \ results using the shopper's attribute preferences\nBoolean\nNo\n\ngetGroupProducts\ntrue\nReturns all\
        \ color/size variants grouped under each recommended product\nBoolean\nNo\n\ngroupProductsFields\nproduct_attributes.color,price\n\
        Comma-separated list of fields to include in the grouped variants; products missing any listed field are\
        \ dropped\nString\nNo\n\ngetAllGroupProductsFields\ntrue\nReturns all variant fields without dropping products\
        \ for missing fields; automatically enables getGroupProducts\nBoolean\nNo\n\nexcludeViewDay\n30\nDays before\
        \ excluding previously viewed products\nInteger\nNo\n\nexcludeViewItem\n100\nNumber of viewed products to\
        \ exclude\nInteger\nNo\n\nexcludePurchaseDay\n30\nDays before excluding previously purchased products\n\
        Integer\nNo\n\nexcludePurchaseItem\n100\nNumber of purchased products to exclude\nInteger\nNo\n\nSample\
        \ Request\nThe sample below shows a request to Visually Similar Products, the algorithm that suggests items\
        \ frequently bought or viewed alongside the anchor product.\n\nhttps://recommendation.api.useinsider.com/v2/visually-similar?partnerName={PartnerName}&locale={Locale}&productId={ABC123}&size=3\n\
        \nSample Response\n{\n  \"success\": true,\n  \"total\": 3,\n  \"types\": { \"vs\": 3 },\n  \"data\": [\n\
        \    \"649517_49890\",\n    \"568334_49053\",\n    \"639714_49677\"\n  ]\n}\n\nFallback Algorithms\nWhen\
        \ the Visually Similar Products results are insufficient, these algorithms fill the response:\n\nViewed\
        \ Together\n\nMost Popular Items in Category\n\nMost Popular Items"
      security:
      - RequestToken: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/{algorithm-name}:
    get:
      operationId: getRecommendations
      summary: Get Recommendations
      tags:
      - Recommendations
      description: "The Recommendation API (SR-API) is a RESTful service for programmatically retrieving personalized\
        \ product suggestions. It serves as the interface to Insider One’s recommendation engine, utilizing machine\
        \ learning models, real-time user behavior analysis, and product affinity data to return structured item\
        \ sets.\n\nEndpoint\nThe Recommendation API follows a standard RESTful pattern:\n\nGET https://recommendation.api.useinsider.com/v2/{algorithm-name}\n\
        \n{algorithm-name} is the unique identifier for the recommendation logic to be executed.\n\nExamples:\n\n\
        /v2/most-popular - Most viewed products\n\n/v2/user-based - Personalized user recommendations\n\n/v2/purchased-together\
        \ - Frequently bought together items\n\nRefer to Algorithm Descriptions for the full list.\n\nBefore making\
        \ your first request, you'll need:\n\nAll requests require your API token in the request header.\n\nPartner\
        \ ID/Name - Your store identifier\n\nLocale - Language and region code used for recommendation context (e.g.,\
        \ en_US, fr_FR)\n\nCurrency - Currency code (e.g., USD, EUR)\n\nAlgorithm Abbreviations\nEach algorithm\
        \ has a short abbreviation used in response payloads:\n\nmvop = Most Popular Items\n\nub = User Based\n\n\
        btb = Purchased Together\n\nchef = Chef (automated strategy selector)\n\nRefer to the Algorithm Descriptions\
        \ for the complete list.\n\nQuery Parameters\nAll endpoints support common parameters:\n\nParameter\nPurpose\n\
        Type\nRequired\n\npartnerName\nYour store identifier\nString\nYes\n\nlocale\nLanguage/region (e.g., en_US)\n\
        String\nYes\n\ncurrency\nCurrency code (e.g., USD)\nString\nYes\n\nuserId\nUser identifier for personalization\n\
        String\nNo\n\ncategoryList\nFilter by product categories\nArray\nNo\n\nfilter\nAdvanced filtering (see Filtering\
        \ Guide)\nString\nNo\n\nsize\nNumber of products (0-100)\nInteger\nNo\n\ndetails\nInclude full product information\n\
        Boolean\nNo\n\nSample Request\ncurl -X GET \"https://recommendation.api.useinsider.com/v2/most-popular?partnerName=dataforceapi&locale=tr_TR&size=1&details=true\"\
        \ \\\n     -H \"X-Auth-Token: YOUR_API_TOKEN\"\n\nconst apiToken = 'YOUR_API_TOKEN';\n                 \
        \   const endpoint = 'https://recommendation.api.useinsider.com/v2/most-popular';\n                    const\
        \ params = {\n                    partnerName: 'yourPartnerName',\n                    locale: 'tr_TR',\n\
        \                    size: 1,\n                    details: true\n                    };\n             \
        \       const queryString = new URLSearchParams(params).toString();\n                    fetch(`${endpoint}?${queryString}`,\
        \ {\n                    method: 'GET',\n                    headers: {\n                    'X-Auth-Token':\
        \ apiToken\n                    }\n                    })\n                    .then(response => response.json())\n\
        \nimport requests\n                    api_token = 'YOUR_API_TOKEN'\n                    endpoint = 'https://recommendation.api.useinsider.com/v2/most-popular'\n\
        \                    params = {\n                    'partnerName': 'yourPartnerName',\n               \
        \     'locale': 'tr_TR',\n                    'size': 1,\n                    'details': True\n        \
        \            }\n                    headers = {\n                    'X-Auth-Token': api_token\n       \
        \             }\n                    response = requests.get(endpoint, params=params, headers=headers)\n\
        \                    data = response.json()\n                    print(data)\n\nSample Response\nResponses\
        \ follow a consistent JSON structure:\n\n{\n        \"success\": true,\n        \"total\": 10,\n       \
        \ \"types\": {\n        \"mvop\": 10\n        },\n        \"data\": [\"productId1\", \"productId2\", ...]\n\
        \        }\n\n<p >With details=true, the data array contains full product objects including pricing, images,\
        \ categories, and attributes.</p> \n\n200 / Success-OK\nA successful response looks like this:\n\n{\n  \
        \      \"success\": true,\n        \"total\": 1,\n        \"types\": {\n        \"mvop\": 1\n        },\n\
        \        \"data\": [\"SKU-DK-0011\"]\n        }\n\nField\nMeaning\n\nsuccess\nBoolean indicating if the\
        \ request succeeded\n\ntotal\nNumber of products returned\n\ntypes\nAlgorithm(s) used (mvop = Most Popular\
        \ of Partner)\n\ndata\nArray of product IDs\n\nGetting Product Details\nBy default, the API returns only\
        \ product IDs. To get full product information (images, prices, descriptions), add details=true.\n\ncurl\
        \ -X GET \"https://recommendation.api.useinsider.com/v2/most-popular?partnerName=yourpartnername&locale=tr_TR&size=1&details=true\"\
        \ \\\n     -H \"X-Auth-Token: YOUR_API_TOKEN\"\n\nconst params = {\n                    partnerName: 'yourpartnername',\n\
        \                    locale: 'tr_TR',\n                    size: 1,\n                    details: true\n\
        \                    };\n\nparams = {\n                    'partnerName': 'yourpartnername',\n         \
        \           'locale': 'tr_TR',\n                    'size': 1,\n                    'details': True\n  \
        \                  }\n\nResponse with details=true includes:\n\nimage_url - Product image\n\nname - Product\
        \ name\n\nprice - Product pricing (by currency)\n\ncategory - Product categories\n\ndiscount - Discount\
        \ information\n\nin_stock - Stock status\n\nHere is a full example with details=true:\n\n{\n        \"success\"\
        : true,\n        \"total\": 1,\n        \"types\": {\n        \"mvop\": 1\n        },\n        \"data\"\
        : [\n        {\n        \"item_id\": \"SKU-HA-0011\",\n        \"name\": \"Hummingbird Decorative Cushion\"\
        ,\n        \"locale\": \"en_US\",\n        \"image_url\": \"https://cdn.demo-shop.com/images/home-accessories/hummingbird-cushion-45x45.jpg\"\
        ,\n        \"url\": \"https://www.demo-shop.com/en/home-accessories/hummingbird-decorative-cushion?ins_sr=eyJwcm9kdWN0SWQiOiJTS1UtSEEtMDAxMSJ9\"\
        ,\n        \"in_stock\": 1,\n        \"price\": {\n        \"USD\": 24.99\n        },\n        \"original_price\"\
        : {\n        \"USD\": 29.99\n        },\n        \"discount\": {\n        \"USD\": 5.0\n        },\n   \
        \     \"category\": [\n        \"Home Accessories\",\n        \"Decorative Cushions\"\n        ],\n    \
        \    \"description\": \"Soft cotton decorative cushion with hummingbird pattern. Ideal for living rooms\
        \ and bedrooms.\",\n        \"brand\": \"Demo Home\",\n        \"color\": \"Multicolor\",\n        \"size\"\
        : \"45x45 cm\",\n        \"tags\": [\n        \"cushion\",\n        \"home-decor\",\n        \"living-room\"\
        \n        ],\n        \"material_type\": \"Cotton\",\n        \"washable\": \"Yes\",\n        \"room\":\
        \ \"Living Room\"\n        }\n        ]\n        }\n\nThe following table demonstrates the status codes\
        \ and response types from the Recommendation API. The table lists Status Codes, their descriptions, and\
        \ scenarios that you can receive these status codes.\n\nStatus Code\nStatus Code Scenarios\n\n200 - Success\n\
        Successful API requests receive responses with 200 status code.\n\n400 - Bad Request\nUnsuccessful API requests\
        \ receive responses with 400 status code.API calls with missing endpoint parameters receive this status\
        \ code.\n\n403 - Forbidden\nUnauthorized API requests receive responses with 403 status codeAPI calls that\
        \ result with unsuccessful Origin/CORS Validation receive this status code.\n\n422 - Unprocessible Content\n\
        API calls that have missing dynamic filter content receive this status code.Refer to the Filtering Products\
        \ documentation for further details.\n\n429 - Too Many Requests\nThrottled API requests receive responses\
        \ with 429 status code.\n\n200 / Success-OK\nSuccessful Recommendation API requests receive an API endpoint\
        \ that contains the following fields:\n\nsuccess field that denotes the success of the API response,\n\n\
        total field displays the number of recommendations returned from the API response,\n\ntypes field that lists\
        \ recommendation algorithm types that returned from the endpoint,\n\ndata field lists the recommendations\
        \ and their details\n\nFollowing is a successful Recommendation API request and its example response:\n\n\
        Sample Request\nhttps://recommendationv2.api.useinsider.com/v2/most-popular?details=true&partnerName=yourPartnerName&locale=en_US¤cy=USD&size=1\n\
        \nSample Response\n{\n    \"success\": true,\n    \"total\": 1,\n    \"types\": {\n        \"mvop\": 1\n\
        \    },\n    \"data\": [\n        {\n            \"image_url\": \"http://insiderone.com/img/p/1/3/13.jpg\"\
        ,\n            \"name\": \"Hummingbird cushion\",\n            \"item_id\": \"11\",\n            \"url\"\
        : \"https://insiderone.com/home-accessories/11-hummingbird-cushion.html#ins_sr=eyJwcm9kdWN0SWQiOiIxMSJ9\"\
        ,\n            \"description\": \"Hummingbird cushion in category Home Accessories\",\n            \"in_stock\"\
        : 1,\n            \"price\": {\n                \"USD\": 0.57\n            },\n            \"locale\": \"\
        en_US\",\n            \"product_attributes\": {\n                \"test\": \"productTest\",\n          \
        \      \"testattributes\": \"productTest\"\n            },\n            \"category\": [\n              \
        \  \"Home Accessories\"\n            ],\n            \"discount\": {\n                \"USD\": 0.0\n   \
        \         },\n            \"original_price\": {\n                \"USD\": 0.57\n            }\n        }\n\
        \    ]\n}\n\n400 / Bad Request\nIn the following scenarios, the Recommendation API returns responses with\
        \ a 400 status code:\n\nMissing required endpoint parameters\n\nMissing required endpoint parameter values\n\
        \nWrong usage of endpoint parameters\n\nFollowing API requests and responses demonstrate examples of these\
        \ scenarios.\n\nSample Request 1\nThe partnerName parameter is missing in the request below:\n\nhttps://recommendationv2.api.useinsider.com/v2/most-popular?details=true¤cy=USD&locale=en_US\n\
        \nSample Response 1\n{\n    \"success\": false,\n    \"message\": \"Missing parameter: partnerName\",\n\
        \    \"data\": []\n}\n\nSample Request 2\nThe locale value is missing in the request below:\n\nhttps://recommendationv2.api.useinsider.com/v2/most-popular?details=true¤cy=USD&locale=&partnerName=yourPartnerName\n\
        \nSample Response 2\n{\n    \"success\": false,\n    \"message\": \"Locale is invalid.\",\n    \"data\"\
        : []\n}\n\n403 / Forbidden\nThe Recommendation API performs sender origin validation for partners that enable\
        \ the Origin/CORS Validation feature. When the feature is enabled, the Recommendation API only provides\
        \ successful recommendation content to callers from the allowed domains. Requests from domains that are\
        \ not listed as allowed domains will receive failures with a 403 status code.\n\nFollowing is the Recommendation\
        \ API response for unsuccessful validations:\n\n{\n    \"success\": false,\n    \"message\": \"Origin validation\
        \ error.\",\n    \"data\": []\n}\n\n422 / Unprocessible Content\nThis endpoint response status code is often\
        \ received when the partner page that hosts the recommendation campaign cannot provide the details that\
        \ the Recommendation API endpoint needs to use.\n\nAs an example scenario;\n\nYou create and activate a\
        \ Web Smart Recommender campaign on Product Pages that has Dynamic Filtering usage on the color field.\n\
        \nIn Dynamic Filtering, the attribute values of fields used in filters are fetched from the Recommendation\
        \ API.\n\nThus, web clients are not informed whether the requested attribute is present for the current\
        \ product.\n\nIn cases where the attribute value that is used in the Dynamic Filter is missing, the Recommendation\
        \ API cannot perform the Dynamic Filter.\n\nThe API returns with a 422 status code for those cases.\n\n\
        Sample Request\nhttps://recommendationv2.api.useinsider.com/v2/most-popular?details=true&filter=([color][=][${value}])¤cy=TRY&locale=tr_TR&partnerName=yourPartnerName&productId=11\n\
        \nSample Response\nThe color attribute was missing for the given item with ID “11”. When this attribute\
        \ is requested with dynamic filtering, the Recommendation API responds with a 422 status code (denoting\
        \ that an unprocessible content is present)\n\n{\n    \"success\": false,\n    \"message\": \"The field\
        \ 'color' in dynamic filter was not found in the product.\",\n    \"data\": []\n}\n\n429 / Too Many Requests\n\
        When you exceed the rate limit, the Recommendation API will temporarily throttle your requests. Rate limits\
        \ are calculated using a rolling one-minute window, so if you're throttled, you'll regain access once the\
        \ current window resets (at most one minute).\n\n{\n    \"success\": false,\n    \"message\": \"Rate exceeded.\"\
        ,\n    \"data\": []\n}\n\nFiltering Recommendation Responses\nFiltering allows you to refine recommendation\
        \ results to match your users' needs and preferences. Common use cases include:\n\nExclude already-viewed\
        \ products - Don't recommend products the user has seen\n\nPrice range filtering - Show only products within\
        \ budget\n\nCategory/brand filtering - Focus on specific product types\n\nStock filtering - Only recommend\
        \ in-stock items\n\nAttribute filtering - Filter by custom product attributes (color, size, rating, etc.)\n\
        \nThis increases relevance, improves user experience, and boosts conversion rates.\n\nBasic Syntax\nhttps://recommendation.api.useinsider.com/v2/{algorithm}?...\\\
        &filter=[{field}][{operator}][{value}]\n\nHere is an example with a single filter that returns  products\
        \ with prices greater than 100 USD:\n\n?filter=[price.USD][>][100]\n\nMultiple Filters\nYou can pass multiple\
        \ filter parameters to combine conditions. Each condition is chained together via an asterisk (*).\n\nSyntax\n\
        ?filter=[field1][operator1][value1]*[field2][operator2][value2]\n\nHow Multiple Filters work\nMultiple filters\
        \ are combined with AND logic - products must match ALL conditions to be included.\n\nExample 1: Exclude\
        \ current product + filter by category\n?filter=[item_id][!=][PRODUCT_ID]*[category][~][Shoes]\n\nThis filter\
        \ returns products that are NOT PRODUCT_ID AND contain \"Shoes\" in the category.\n\nExample 2: Price range\
        \ + in stock\n?filter=[price.USD][>][50]*[price.USD][<][200]*[in_stock][=][1]\n\nThis filter returns products\
        \ between $50-$200 AND in stock.\n\nOperator Reference\n\nOperator Name\nSymbol\nAlias\nDescription\nExample\n\
        \nEqual To\n=\nis\nExact match on field value\n[color][=][Blue] or [brand][=][Niki]\n\nNot Equal To\n!=\n\
        nis\nExcludes products with matching field value\n[color][!=][Red] (exclude red products)\n\nGreater Than\n\
        >\ngt\nField value greater than the specified value\n[price.USD][>][100] or [rating][>][3.5]\n\nGreater\
        \ Than or Equal\n>=\ngte\nField value greater than or equal to the specified value\n[price.EUR][>=][150]\
        \ or [rating][>=][4]\n\nLess Than\n<\nlt\nField value less than the specified value\n[price.EUR][<][150]\
        \ or [stock_count][<][5]\n\nLess Than or Equal\n<=\nlte\nField value less than or equal to the specified\
        \ value\n[price.EUR][<=][150] or [created_at][<=][now-7d]\n\nContains\n~\nctn\nField contains the specified\
        \ value (text search)\n[category][~][Shoes] or [name][~][Niki Air]\n\nDoes Not Contain\n!~\nnctn\nField\
        \ does not contain the specified value\n[category][!~][Clearance]\n\nBetween\n><\nbtw\nField value falls\
        \ within a range. Format: [field][><][lower_bound:upper_bound]\n[price.USD][><][50:200]\n\nNot Between\n\
        >!<\nnbtw\nField value falls outside a range\n[price.USD][>!<][50:200] (exclude $50-$200 range)\n\nExists\n\
        ?\nxst\nCheck if a field exists (value=1) or does not exist (value=0)\n[price.USD][?][1] (products have\
        \ USD price)\n\nDate Field Values\nInsider One is designed to parse every filter value provided for date\
        \ fields. If a simplified date expression fails to parse, the system will use it as a raw literal value.\
        \ This allows you to use literal dates (e.g., \"2022-09-30 15:45:00\") directly in your date filters.\n\n\
        The date fields available for filtering are: created_at and modified_at.\n\nOperator Compatibility\nDate\
        \ fields are supported by every operator except for Between (><) and Not Between (>!<). This limitation\
        \ is due to the Between operator using a colon (:) to separate the lower and upper bounds, which conflicts\
        \ with the colon present in standard date/time formats (e.g., 2022-09-30 15:45:00).\n\nThe most appropriate\
        \ operators for date fields are:\n\nAfter (>)\n\nBefore (<)\n\nIs (=)\n\nIs Not (!=)\n\nRelative Date Filtering\n\
        Date filters also support relative unit values, allowing you to easily filter based on time relative to\
        \ the current moment (now).\n\nAnchor: now\n\nUnits: w (week), d (day), h (hour)\n\nModifiers: Use + to\
        \ add units or - to subtract units.\n\nYou can see the examples below:\n\nScenario\nFilter Expression\n\n\
        Get products that were created last week\n[created_at][>][now-1w]\n\nGet products created up to 2 days ago\n\
        [created_at][<=][now-2d]\n\nMultiple Value Filtering (In / Not-In Filter Behavior)\nMatch fields against\
        \ multiple values by separating them with:\n\n||\n\nSupported by all operators except between and not between.\n\
        \nExamples:\n\nGet products from multiple brands:\n\n?filter=[brand][=][Niki||Abiba||Pamu]\n\nExclude multiple\
        \ colors:\n\n?filter=[color][!=][Red||Green||Blue]\n\nGet products with categories containing any of these\
        \ terms:\n\n?filter=[category][~][Shoes||Boots||Sneakers]\n\nAdvanced Filtering with AND/OR\nCombine multiple\
        \ filters using logical operators within a single filter parameter.\n\nAnd (*) = both conditions must be\
        \ true\n\nOr (|) = either condition can be true\n\nExamples\n\nAND Example: Price range AND brand\n\n?filter=([price.USD][>][100]*[brand][=][Niki])\
        \ \n\nOR Example: Multiple categories\n\n?filter=([category][~][Shoes]|[category][~][Boots])\n\nComplex:\
        \ (A AND B) OR C\n\nGet products that are either (cheap AND in stock) OR highly rated:\n\n?filter=((price.USD][<][50]*[in_stock][=][1])|[rating][>=][5])\n\
        \nYou can also use multiple parameters to achieve AND logic more simply:\n\n?filter=[price.USD][<][50]&filter=[in_stock][=][1]&filter=[rating][>=][5]\n\
        \nThis is often clearer than using complex parentheses.\n\nDynamic Filters\nUse ${value} to reference the\
        \ source product's field value in your filter. The expression is computed at request time using the actual\
        \ product data.\n\nSupported Expressions\n\n${value} - Use the product's field value as-is\n\n${value*1.2} -\
        \ Multiply by 1.2 (20% increase)\n\n${value*0.8} - Multiply by 0.8 (20% decrease)\n\n${value*0.8}:${value*1.3} -\
        \ Range with dynamic bounds\n\nExamples\n\nMatch the product's category dynamically:\n\n?categoryList=${value}&productId=PRODUCT_ID\n\
        \nIf the product has a category \"Shoes\", recommendations are filtered to \"Shoes\" only.\n\nShow products\
        \ in a similar price range (±30%):\n\n?productId=PRODUCT_ID&filter=[price.EUR][><][${value}:${value*1.3}]\n\
        \nIf the product costs €100, it shows products priced €100-€130.\n\nFilter Validation Errors\nWhen filters\
        \ are invalid, the API returns specific error messages with HTTP status codes:\n\nFormat & Syntax Errors\
        \ (400)\n\nError\nCause\n\n\"Filter is not in correct format.\"\nMissing brackets, unmatched parentheses,\
        \ invalid syntax\n\n\"Depth of nested filters is greater than 4.\"\nToo many nesting levels: ((((filter))))\n\
        \n\"Number of filters is greater than 40.\"\nToo many filter conditions total\n\nField Errors (400 or 422)\n\
        \nError\nHTTP\nCause\n\n\"Entered field name is invalid.\"\n400\nField doesn't exist in product data\n\n\
        \"The field '%s' in dynamic filter was not found in the product.\"\n422\nField missing in source product\
        \ (dynamic filters only)\n\n\"Field $$$ is not filterable product attribute.\"\n400\nField marked non-filterable\
        \ in configuration\n\nOperator Errors (400)\n\nError\nCause\n\n\"operator field is invalid.\"\nUnknown operator\
        \ (use: =, !=, >, <, >=, <=, ~, !~, ><, >!<, ?)\n\n\"For the $$$ field, operator field is not valid by field\
        \ type.\"\nOperator incompatible with field type (e.g., ~ on numeric field)\n\n\"Operator $$$ is not allowed\
        \ for dynamic filters.\"\nEXIST/EXIST_ALIAS not allowed with ${value}\n\nValue Errors (400 or 422)\n\nError\n\
        HTTP\nCause\n\n\"For the $$$ field, entered value is empty.\"\n422\nBlank or null value\n\n\"For the $$$\
        \ field, value length is invalid.\"\n400\nExceeds limits (100 chars for text search, 340 for others)\n\n\
        \"Value for the field $$$ is invalid.\"\n400\nInvalid range format (use lower:upper for >< operator)\n\n\
        \"For the $$$ field, value type is invalid.\"\n400\nType mismatch (non-numeric on numeric field)\n\nField-Specific\
        \ Validations (400)\n\nField\nError\nCause\n\nin_stock\n\"Value is invalid for in_stock filter...\"\n0 or\
        \ 1 only\n\nDynamic Filter Errors (400)\n\nError\nCause\n\n\"Parameters productId and locale must be provided\
        \ when dynamic value is used.\"\nUsing ${value} without providing productId or locale\n\n\"Product not found\"\
        \nSpecified productId doesn't exist\n\nLimitations\n\nConstraint\nLimit\nNotes\n\nFilter depth\n4 levels\n\
        Maximum nesting depth for parentheses\n\nTotal filters\n40 filters\nTotal number of filter conditions in\
        \ one request\n\nN-gram value length\n100 characters\nFor text search on item_id, name, image_url\n\nOther\
        \ field value length\n340 characters\nFor text search on other fields\n\nPersonalized Recommendation Features\n\
        The Recommendation API provides a range of personalization capabilities that tailor product recommendations\
        \ to individual users. By leveraging user behavior, such as browsing history, purchase activity, and real-time\
        \ interactions, the API delivers more relevant product suggestions that increase engagement and conversion\
        \ rates.\n\nTo enable personalization, you must include the Insider ID in your Recommendation API requests.\
        \ This allows the system to associate incoming requests with existing user profiles and apply behavior-driven\
        \ logic.\n\nCurrently, the Recommendation API supports the following personalization features:\n\nPersonalized\
        \ Recommendation Algorithms\nThe following recommendation algorithms inherently deliver personalized product\
        \ suggestions based on user behavior and interaction data.\n\nUser-Based Recommendations\n\nGenerate personalized\
        \ recommendations by analyzing a user’s historical interactions and the behavior patterns of similar users.\n\
        \nReal-Time User Engagement Recommendations\n\nProvide real-time personalized suggestions based on the user’s\
        \ current session activity and live interactions.\n\nRecently Viewed Products\n\nRecommend products based\
        \ on the user’s most recent product page views, helping reinforce recent browsing intent.\n\nPurchased with\
        \ Last Purchased\n\nSuggest products that are frequently purchased together with the user’s most recent\
        \ purchase, supporting effective cross-sell scenarios.\n\nThese algorithms leverage both historical and\
        \ real-time data to ensure recommendations remain relevant, timely, and aligned with individual user preferences.\n\
        \nPersonalization with the User’s Last Visited Item\nThe Recommendation API can personalize results using\
        \ the last product page a user visited. This behavior applies to both User-Based Recommendations and Real-Time\
        \ User Engagement algorithms.\n\nWhen the API does not have sufficient user-level data to generate a fully\
        \ personalized recommendation, it automatically falls back to Viewed Together recommendations based on the\
        \ user’s most recently viewed product.\n\nThis fallback mechanism ensures that recommendations remain relevant\
        \ and context-aware, even when historical user data is limited.\n\nPersonalization with Users Recent Interactions\n\
        The Recommendation API can automatically exclude products a user has already interacted with, so they won't\
        \ see recommendations for items they've viewed, purchased, or otherwise engaged with.\n\nUse the following\
        \ parameters to enable these exclusions:\n\nAPI Endpoint Parameter\nDescription\n\nexcludeViewItem\nExcludes\
        \ the last X Product Visits of the user from the API response\n\nexcludeViewDay\nExcludes Product Page views\
        \ of the user in the last X days from the API response\n\nexcludePurchaseItem\nExcludes the last X Product\
        \ Purchases of the user from the API response\n\nexcludePurchaseDay\nExcludes Product Purchases of the user\
        \ in the last X days from the API response\n\nThe following Recommendation API requests illustrate these\
        \ personalization features:\n\nThe request below instructs the Recommendation API to exclude the last ten\
        \ products the user viewed in Product Detail pages from the API response:\n\nhttps://recommendationv2.api.useinsider.com/v2/most-popular?details=true¤cy=TRY&locale=tr_TR&partnerName=dataforceapi&userId=testUser&excludeViewItem=10\n\
        \nThe request below instructs the Recommendation API to exclude the products that the user purchased in\
        \ the last three days.\n\nhttps://recommendationv2.api.useinsider.com/v2/most-popular?details=true¤cy=TRY&locale=tr_TR&partnerName=dataforceapi&userId=testUser&excludePurchaseDay=3\n\
        \nAttribute Affinity\nAttribute affinity scores represent a user’s preference for specific product attributes\
        \ based on their interaction behavior, including product views, add-to-cart actions, and purchases. Purchases\
        \ carry a higher weight than views, as they indicate stronger intent. Affinity scores are normalized by\
        \ a user’s total activity. As a result, a user with a high purchase-to-view ratio demonstrates a stronger\
        \ affinity than a user who browses frequently but converts rarely.\n\nThe Recommendation API uses attribute\
        \ affinity to personalize product recommendations according to each user’s demonstrated interests. Affinity\
        \ data is refreshed daily, ensuring recommendations reflect recent and relevant user behavior.\n\nWithin\
        \ the Recommendation API, the hp endpoint parameter controls whether the Attribute Affinity feature is applied.\
        \ When enabled, the API incorporates a user’s attribute affinity scores into the recommendation logic, prioritizing\
        \ products that align with the user’s strongest preferences.\n\nThe following Recommendation API request\
        \ demonstrates how the Attribute Affinity feature is applied when the hp parameter is enabled:\n\nhttps://recommendationv2.api.useinsider.com/v2/most-popular?details=true¤cy=TRY&locale=tr_TR&partnerName=yourPartnerName&userId=testUser&hp=1\n\
        \nAPI Rate Limits\nThe rate limit for direct API calls is set to 1000 calls per minute, applied across all\
        \ endpoints of the Recommendation API. Exceeding this rate limit causes additional requests to return 429\
        \ status codes.\n\n<p >If your technical architecture requires a higher throughput, contact the Insider\
        \ One team.</p> \n\nBest Practices for Recommendation API\nCategory List Format\nWhen filtering by categories,\
        \ pass categoryList as a URL-encoded JSON array:\n\ncategoryList=[\"shoes\",\"boots\"]\n\nIn cURL, encode\
        \ the brackets properly:\n\n?categoryList=[\"shoes\",\"boots\"]\n\nHyperpersonalization (hp)\nEnable hyperpersonalization\
        \ by adding hp=1 or hp=true:\n\n?userId=user123&hp=1\n\nThis uses customer affinities to further personalize\
        \ results.\n\nMixed Strategy\nCombine multiple recommendation algorithms in a single request to get diverse\
        \ results.\n\nGET /mixed?partnerName=X&locale=en_US&userId=user1¤cy=USD&strategy=[...]\n\nStrategy array\
        \ format:\n[\n  {\"recommendationType\": \"ub\", \"size\": 4},\n  {\"recommendationType\": \"vtv\", \"size\"\
        : 3, \"productId\": \"prod1\"},\n  {\"recommendationType\": \"mvop\", \"size\": 3, \"filters\": [\"\\[category\\\
        ]\\[=\\]\\[shoes\\]\"]}\n]\n\nAvailable types: ub, ue, vtv, btb, cp, sp, mvoc, mvop, mpoc, mpop, mpol, naoc,\
        \ naop, tpoc, tpop, mvpoc, mvpop, mm, hdop, hdoc, rvp, lpt\n\nEach strategy specifies its algorithm type,\
        \ the number of products to return, and, optionally, its own filters.\n\nManual Merchandising in Mixed\n\
        Use mm to include specific products you want to promote. The productId field is required.\n\n{\"recommendationType\"\
        : \"mm\", \"size\": 3, \"productId\": \"featured1,featured2,featured3\"}\n\nFull example:\n\nGET /mixed?partnerName=X&locale=en_US¤cy=TRY&strategy=[{\"\
        recommendationType\":\"ub\",\"size\":5},{\"recommendationType\":\"mm\",\"size\":3,\"productId\":\"promo1,promo2,promo3\"\
        },{\"recommendationType\":\"mvop\",\"size\":2}]\n\nPass product IDs as comma-separated values.\n\nProducts\
        \ are returned in the order you specify.\n\nOnly in-stock products are returned.\n\nMultiple Item IDs in\
        \ Item-Based Algorithms\nGet recommendations based on multiple products at once by passing comma-separated\
        \ IDs:\n\nGET /vtv?partnerName=X&locale=en_US&productId=item1,item2,item3&size=10¤cy=USD\n\nSupported endpoints\
        \ are /vtv, /btb, /cp, /sp. It is useful when you want recommendations based on multiple items in a cart\
        \ or wishlist.\n\nGroup Products\nInclude product variants (e.g., different sizes/colors) in the response\
        \ using getGroupProducts.\n\nGET /ub?partnerName=X&locale=en_US&userId=user1&getGroupProducts=true&groupProductsFields=price,in_stock,product_attributes.color\n\
        \nParameters\n\ngetGroupProducts=true — Enable variant products in response\n\ngroupProductsFields — Additional\
        \ fields to include (comma-separated)\n\nResponse structure\n{\n  \"item_id\": \"shoe-blue-m\",\n  \"group_products\"\
        : [\n    {\"item_id\": \"shoe-blue-s\", \"price\": {\"USD\": 99}, \"in_stock\": 1},\n    {\"item_id\": \"\
        shoe-blue-l\", \"price\": {\"USD\": 99}, \"in_stock\": 1}\n  ]\n}\n\nVariants are grouped by groupcode.\
        \ You can request nested fields, such as product_attributes.color.\n\nFilter Chaining with asteriks (*)\n\
        To combine multiple filters with AND logic, use *.  Here is an example of applying multiple filters:\n\n\
        GET \n...&filter=[category][=][shoes]*[brand][=][nike]*[price][<][100]"
