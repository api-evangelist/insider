      operationId: purchasedTogether
      summary: Purchased Together
      tags:
      - Algorithm Descriptions
      description: "The Purchased Together algorithm recommends items by finding complementary products purchased\
        \ by other users who have also purchased the user's items. It generates recommendations based on products\
        \ purchased in the same sessions and in the same locale over the past 30 days. After generating recommendations,\
        \ the Purchased Together algorithm orders the results according to purchase frequency. With the Purchased\
        \ Together algorithm, you can apply your users' purchase patterns to your strategies. This type of algorithm\
        \ works best on product and cart pages.\n\nEndpoint\n\nGET https://recommendation.api.useinsider.com/v2/purchased-together\n\
        \nWhen this algorithm is used on the cart page, its endpoint differs for multiple products. For example,\
        \ three products (X, Y, Z) are in the cart. The recommendation API will return the complementary products\
        \ for each product in the cart as X1, Y1, Z1, X2, Y2, Z2... respectively.\n\nQuery Parameters\n\nParameter\n\
        Sample Value\nDescription\nData Type\nRequired\n\npartnerName\nmybrand\nPartner Identifier assigned by Insider\
        \ One. You can use PartnerID as well.\nString\nYes\n\nlocale\nus_US\nLocale of the requested product catalog\n\
        String\nYes\n\nplatform\nweb\nRequested platform. Web comes by default.\nEnum\nNo\n\ncurrency\nUSD\nRequested\
        \ currency of the products. If no value is set, the default currency in your settings is used.\nString\n\
        No\n\nproductId\nABC1234\nThe ID of the product whose complementary is requested\nString\nYes\n\nsize\n\
        50\nRequired number of items in response. Valid values are 0 to 100.\nInteger\nNo\n\ncategoryList\n[“Clothes”,\
        \ “Skirts”]\nCategory filter of the products\nArray (of string)\nNo\n\nfilter\n\nSmart Recommender filtering.\
        \ There can be more than one filter parameter.\nString\nNo\n\ndetails\ntrue\nAdds details to the products\
        \ of the response\nBoolean\nNo\n\nshuffle\nfalse\nShuffles the products of the response\nBoolean\nNo\n\n\
        getGroupProducts\nfalse\nShows variant products under the products of the response\nBoolean\nNo\n\ngroupProductsFields\n\
        \nAdds these fields to the variant products’ details\nString\nNo\n\nexcludeVariants\ntrue\nExclude variants\
        \ from the response\nBoolean\nNo\n\nuserId\ntestUser\nUser identifier which is assigned by Insider One\n\
        String\nNo\n\nhp\ntrue, false, or 0, 1\nMakes affinities affect products of the response. The default is false.\n\
        Boolean\nNo\n\nexcludeViewDay\n30\nAfter how many days viewed products should be excluded. The default is\
        \ -1.\nInteger\nNo (Can only be used with userId)\n\nexcludeViewItem\n10\nHow many viewed products should\
