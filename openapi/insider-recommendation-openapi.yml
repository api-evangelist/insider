        \ interactions. It generates personalized recommendations based on real-time behaviors and evolving preferences.\n\
        \nThe User Engagement algorithm tailors product recommendations based on the user’s most recent product-view\
        \ activity, using a deep-learning transformer model that dynamically adapts to recent interactions, such\
        \ as viewing or purchasing patterns. It focuses specifically on items the user has shown interest in during\
        \ recent sessions. During a Recommendation API request to the user-engagement endpoint, the UCD profile\
        \ endpoint is called to retrieve the last 10 products the user visited in the past 7 days. To receive User\
        \ Engagement recommendations, the user must have at least one product visit in the last 7 days. If there\
        \ have been no visits in that period, fallback recommendation results will be displayed instead.\n\nEndpoint\n\
        \nGET https://recommendation.api.useinsider.com/v2/user-engagement\n\nQuery Parameters\n\nParameter\nSample\
        \ Value\nDescription\nData Type\nRequired\n\npartnerName\nmybrand\nPartner Identifier assigned by Insider\
        \ One. You can use PartnerID as well.\nString\nYes\n\nlocale\nus_US\nLocale of requested product catalog\n\
        String\nYes\n\nplatform\nweb\nRequested platform. Web comes by default.\nEnum\nNo\n\nuserId\na1b2c3d4\n\
        User identifier which is assigned by Insider One\nString\nYes\n\ncurrency\nUSD\nRequested currency of the\
