        Required number of items in response. Valid values are 0 to 100.\nInteger\nNo\n\ncategoryList\n[“Clothes”,\
        \ “Skirts”]\nCategory filter of the products\nArray (of string)\nNo\n\nfilter\n\nSmart Recommender filtering.\
        \ There can be more than one filter parameter.\nString\nNo\n\ndetails\ntrue\nAdds details to the products\
        \ of the response\nBoolean\nNo\n\nshuffle\nfalse\nShuffles the products of the response\nBoolean\nNo\n\n\
        getGroupProducts\nfalse\nDetermines if the products within the same groupcode should be returned in the\
        \ recommendation response\nBoolean\nNo\n\ngroupProductsFields\n\nDefines the fields that should be returned\
        \ for the products in the group_products section.  If requested group product fields are missing from a\
        \ product, that product won't appear in the group_products section.\nString\nNo\n\nexcludeVariants\ntrue\n\
        Exclude variants from the response. The default value is false. Valid values are 1, 0, true, and false.\n\
        Boolean\nNo\n\nexcludeViewDay\n30\nAfter how many days should viewed products be excluded\nInteger\nNo (Can\
        \ be used only with userId)\n\nexcludeViewItem\n100\nHow many viewed products should be excluded\nInteger\n\
