        \        \"QAZ-7892\",\n        \"XYZ-1342\"\n    ]\n}\n\nFallback Algorithms\nIf the products from Purchased\
        \ Together are not enough to fill the response data, some fallback algorithms below fill it:\n\nView Together\n\
        \nMost Purchased of the Category\n\nMost Purchased of the Partner"
