        \ recommendations based on user behavior and product popularity.\n\nIn this algorithm, product recommendations\
        \ are based on the behavior of similar users (users with close similarity index scores: viewed, purchased,\
        \ or added the same or similar category products to their cart) with the current user. The algorithm recommends\
        \ products that similar users have encountered in the past but that the current user has not visited. The\
        \ user-based algorithm also takes the user-product-rating matrix as another input. For each product a user\
        \ visits, a rating is calculated based on the number of visits, purchases, and add-to-carts within the last\
        \ 30 days. This type of algorithm can be used on every kind of page.\n\nEndpoint\n\nGET https://recommendation.api.useinsider.com/v2/user-based\n\
