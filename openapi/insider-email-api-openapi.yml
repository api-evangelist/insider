  /email/v2/subscribe:
    post:
      operationId: resubscribeEmailUsersForEmailGlobalSubscribe
      summary: Resubscribe Email Users for Email Global Subscribe
      tags:
      - Email
      description: "The Email Resubscribe API allows you to set an unreachable email status as reachable on the Insider's Email platform.\n\nThe Resubscribe API v2 is the latest version of the Email Resubscribe API, which supports bulk data ingestion. If you're still using the previous version (v1), we strongly recommend migrating to this updated version to benefit from bulk updates and enhanced functionality. Please note that new integrations with v1 are no longer supported.\n\nAPI usage changes depending on the identifier format you're using. Please refer to the relevant section based on your identifier configuration.\n\nBody Parameters\n\nParameter\nDescription\nData Type\nRequired\n\nemails\nUser's email address(es)\nString Array\nes (normal and email-based)\n\nuuids\nUsers unique user identifier\nString Array\nYes (only if you are not using email as an identifier and using profile-based)\n\nSample Requests\nWhen Email is the Identifier or Email-Based Flow is Enabled\nEvery request made to the request endpoint requires a request body formatted in JSON and containing your email's content and metadata.\n\nFor the email-based flow, the same request is used; however, it will only update the status of existing users and will not create new users.\n\nThe emails field is required for resubscribe requests.\n\ncurl --location --request POST 'http://contact.useinsider.com/email/v2/subscribe' \\\n--header 'Content-Type: application/json' \\\n--header 'X-PARTNER-NAME: mybrand' \\\n--header 'X-REQUEST-TOKEN: a1b2c3d4e5f6' \\\n--data-raw '{\n     \"emails\": [\n        \"sample1@useinsider.com\",\n        \"sample2@useinsider.com\"\n    ]\n}'\n\nWhen UUID is the Identifier and Profile-Based Flow is Enabled\nEvery request made to the request endpoint requires a request body formatted in JSON and containing your email's content and metadata.\n\nIf the profile-based flow is enabled for your account:- If the user in the request exists, their status will be updated.- If the user does not exist, a new user will be created.\n\nThe uuid, and uploader_email fields are required for resubscribe requests.\n\ncurl --location 'https://contact.useinsider.com/email/v2/subscribe' \\\n--header 'Content-Type: application/json' \\\n--header 'x-request-token: mybrand' \\\n--header 'x-partner-name: a1b2c3d4e5f6' \\\n--data-raw '{\n    \"uuids\": [\n        \"test-uuid-1\",\n        \"test-uuid-2\",\n        \"test-uuid-3\",\n        \"test-uuid-7\"\n    ],\n    \"emails\": [\n        \"samlpe1@useinsider.com\",\n        \"sample2@useinsider.com\",\n        \"sample3@useinsider.com\",\n        \"sample4@useinsider.com\"\n    ]\n}'\n\nSample Responses\n200 OK\n{\n  \"statusMessage\": \"OK\"\n}\n\n400 Bad Request\n{\n  \"statusMessage\": \"Bad request\"\n}\n\n401 Unauthorized\n{\n  \"statusMessage\": \"Unauthorized\"\n}\n\nLimitations\n\nAll functions must be executed with a simple HTTPS POST request.\n\nA maximum of 500 emails or UUIDs can be consumed in one request.\n\nThe API Key should be provided as the authorization key in the request header. If the key is incorrect, the operation will not be executed, and an authorization error will return in the response.\n\nThe value of X-PARTNER-NAME header should be lowercase.\n\n<p >The default limit shown here is a standard baseline. If your use case requires higher capacity, feel free to reach out to the Insider team — we can adjust it to fit your needs.</p>"
      security:
      - PartnerName: []
      - RequestToken: []
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  emails:
                  - sample1@useinsider.com
                  - sample2@useinsider.com
              resubscribe-email-users-for-email-group-subscribe:
                summary: Resubscribe Email Users for Email Group Subscribe
                value:
                  emails:
                  - sample1@useinsider.com
                  - sample2@useinsider.com
                  group_id: 12345
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
    servers:
    - url: https://contact.useinsider.com
  /email/v2/unsubscribe:
    post:
      operationId: unsubscribeEmailUsersForEmailGlobalUnsubscription
      summary: Unsubscribe email users for email global unsubscription
      tags:
      - Email
      description: "The Email Unsubscribe API allows you to ingest email addresses into either the global unsubscribe list or a specific unsubscribe group you created in InOne.\n\nThe Email Unsubscribe API v2 is the latest version of the Email Unsubscribe API, which supports bulk data ingestion. If you're still using the previous version (v1), we strongly recommend migrating to this updated version to benefit from bulk updates and enhanced functionality. Please note that new integrations with v1 are no longer supported.\n\nAPI usage changes depending on the identifier format you're using. Please refer to the relevant section based on your identifier configuration.\n\nBody Parameters\n\nParameter\nDescription\nData Type\nRequired\n\nemails\nUser's email addresses\nString Array\nYes (normal and email based)\n\nuuids\nUser's unique user identifier\nString Array\nYes (only if you are not using email as an identifier and using profile based)\n\nSample Requests\nWhen Email is the Identifier or Email-Based Flow is Enabled\nEvery request made to the request endpoint requires a request body formatted in JSON and containing your email's content and metadata.\n\nIn cases where the email is used as the identifier, if the user exists, their status will be updated; if the user does not exist, a new user will be created.For the email-based flow, the same request is used; however, it will only update the status of existing users and will not create new users.\n\nThe emails field is required for global unsubscribe requests.\n\ncurl --location 'contact.useinsider.com/email/v2/unsubscribe' \\\n--header 'X-PARTNER-NAME: mybrand' \\\n--header 'X-REQUEST-TOKEN: a1b2c3d4e5f6' \\\n--header 'Content-Type: application/json' \\\n--data-raw '{\n    \"emails\": [\n        \"sample1@useinsider.com\",\n        \"sample2@useinsider.com\",\n        \"sample3@useinsider.com\"\n    ]\n}'\n\nWhen UUID is the Identifier and Profile-Based Flow is Enabled\nEvery request made to the request endpoint requires a request body formatted in JSON and containing your email's content and metadata.\n\nIf the profile-based flow is enabled for your account,- If the user in the request exists, their status will be updated.- If the user does not exist, a new user will be created.\n\nThe uuid and email fields are required for global unsubscribe requests.\n\ncurl --location 'http://contact.useinsider.com/email/v2/unsubscribe' \\\n--header 'Content-Type: application/json' \\\n--header 'x-request-token: a1b2c3d4e5f6' \\\n--header 'x-partner-name: mybrand' \\\n--data-raw '{\n    \"users\": [\n        {\n            \"uuid\": \"test-uuid-1\",\n            \"email\": \"sample1@useinsider.com\"\n        },\n        {\n            \"uuid\": \"test-uuid-2\",\n            \"email\": \"sample2@useinsider.com\"\n        },\n        {\n            \"uuid\": \"test-uuid-3\",\n            \"email\": \"sample3@useinsider.com\"\n        },\n        {\n            \"uuid\": \"test-uuid-4\",\n            \"email\": \"sample4@useinsider.com\"\n        }\n    ]\n}'\n\nSample Responses\n200 OK\nThe following response returns if the request is successful.\n\n{\n  \"statusMessage\": \"OK\"\n}\n\n400 Bad Request\n{\n  \"statusMessage\": \"Bad request\"\n}\n\n401 Unauthorized\nThe following response returns if the request is not authorized.\n\n{\n  \"statusMessage\": \"Unauthorized\"\n}\n\nLimitations\nWhen sending your request, make sure to follow these limitations.\n\nAll functions must be executed with a simple HTTPS POST request.\n\nA maximum of 500 emails or UUIDs can be consumed in one request.\n\nThe API Key should be provided as the authorization key in the request header. If the key is incorrect, the operation will not be executed, and an authorization error will return in the response.\n\nThe value of X-PARTNER-NAME header should be lowercase."
      security:
      - PartnerName: []
      - RequestToken: []
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  emails:
                  - sample1@useinsider.com
                  - sample2@useinsider.com
                  - sample3@useinsider.com
              unsubscribe-email-users-for-email-group:
                summary: Unsubscribe email users for email group
                value:
                  emails:
                  - sample1@useinsider.com
                  - sample2@useinsider.com
                  - sample3@useinsider.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                default:
                  value:
                    statusMessage: OK
                unsubscribe-email-users-for-email-group:
                  value:
                    statusMessage: OK
        '429':
          $ref: '#/components/responses/TooManyRequests'
    servers:
    - url: https://contact.useinsider.com
