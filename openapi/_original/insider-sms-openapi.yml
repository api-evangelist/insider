  /analytics/v1/verify:
    post:
      operationId: getOtpVerifySmsAnalytics
      summary: Get OTP / Verify SMS analytics
      tags:
      - SMS
      description: "SMS OTP / Verify Analytics details will be listed for a given time period as you send a request\
        \ to this API.\n\nHeaders\n\nHeader\nSample Value\nDescription\n\nX-INS-AUTH-KEY\n1a2b3c4d5e6f\nThis key\
        \ is required to authorize your request. Refer to API Authentication Tokens to generate your token.\n\n\
        Query Parameters\n\nParameter\nData Type\nDescription\nRequired\n\nstartTime\nint64\nThe time campaign is\
        \ being launched. Specifies a 10-digit epoch start time.\nYes\n\nendTime\nint64\nThe current date (today’s\
        \ date on the payload). It can be customizable according to your use case. Specifies a 10-digit epoch start\
        \ time.\nYes\n\nPlease note that the endTime field operates on a T-1 logic:- To define a time range, ensure\
        \ that the endTime is set to one second before the upper limit of the range.- For example, for a time range\
        \ of 11-11-2024 10:00:00 to 11-11-2024 11:00:00, set the end_date to 11-11-2024 10:59:59The minimum allowed\
        \ time range for requests is 1 hour. If the requested interval is shorter, the system aggregates and returns\
        \ data for the entire hour. For instance, a 30-minute request will still yield data for the full hour.\n\
        \nSample Query\nBefore sending the request, make sure: \n\nTo replace the authorization value with your\
        \ API key.\n\nTo replace the sample values in startTime, and endTime with your values in the required data\
        \ type.\n\ncurl --location 'https://sms.useinsider.com/analytics/v1/verify' \\\n--header 'x-ins-auth-key:\
        \ 1a2b3c4d5e6f' \\\n--header 'Content-Type: application/json' \\\n--data '{\n    \"startTime\": 1727643600,\n\
        \    \"endTime\": 1728334799\n}'\n\nSample Responses\n200 Ok\n{\n    \"messageParts\": 0,\n    \"sent\"\
        : 0,\n    \"dropped\": 0,\n    \"delivery\": {\n        \"count\": {\n            \"delivered\": 0,\n  \
        \          \"undelivered\": 0\n        },\n        \"rate\": \"0.00%\"\n    },\n    \"verification\": {\n\
        \        \"count\": {\n            \"verified\": 0,\n            \"unverified\": 0\n        },\n       \
        \ \"rate\": \"0.00%\"\n    },\n    \"droppedMessages\": {\n        \"internalErrors\": {\n            \"\
        count\": 0,\n            \"rate\": \"0.00%\"\n        },\n        \"countryCodeDrops\": {\n            \"\
        count\": 0,\n            \"rate\": \"0.00%\"\n        },\n        \"invalidPhoneNumbers\": {\n         \
        \   \"count\": 0,\n            \"rate\": \"0.00%\"\n        }\n    },\n    \"undeliveredMessages\": {\n\
        \        \"carrierViolations\": {\n            \"count\": 0,\n            \"rate\": \"0.00%\",\n       \
        \     \"details\": {}\n        },\n        \"hardBounces\": {\n            \"count\": 0,\n            \"\
        rate\": \"0.00%\",\n            \"details\": {}\n        },\n        \"softBounces\": {\n            \"\
        count\": 0,\n            \"rate\": \"0.00%\",\n            \"details\": {}\n        },\n        \"deliveryFailures\"\
        : {\n            \"count\": 0,\n            \"rate\": \"0.00%\",\n            \"details\": {}\n        },\n\
        \        \"deliveryReportMissing\": {\n            \"count\": 0,\n            \"rate\": \"0.00%\"\n    \
        \    }\n    },\n    \"unverifiedMessages\": {\n        \"attemptFailures\": {\n            \"count\": 0,\n\
        \            \"rate\": \"0.00%\"\n        },\n        \"timeoutFailures\": {\n            \"count\": 0,\n\
        \            \"rate\": \"0.00%\"\n        }\n    }\n}\n\n401: Unauthorized request. Please make sure of\
        \ your authorization key correctness\n\n422\n\nThe start time parameter must be earlier than the end time.\n\
        \nThe start time parameter must be within the last 1 year.\n\nThe end time parameter must be earlier than\
        \ the current time.\n\nThe start time parameter must be a valid integer.\n\nThe end time parameter must\
        \ be a valid integer.\n\n429: Your request exceeds the limit.\n\nLimitations\n\nAll functions must be executed\
        \ with an HTTPS POST request.\n\nThe X-INS-AUTH-KEY should be provided as the authorization key on the request\
        \ header. If the key is incorrect, the operation will not be executed and an authorization error will return\
        \ in the response.\n\nThis API provides data for a 1-year range.\n\nYou can send 100 requests per minute with\
        \ the same API Key. If you exceed the rate limit, the perPage value should be between 1-100."
      security:
      - InsAuthKey: []
      requestBody:
        content:
          application/json:
            example:
              startTime: 1727643600
              endTime: 1728334799
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/send:
    post:
      operationId: sendTransactionalSingleSms
      summary: Send transactional Single SMS
      tags:
      - Transactional SMS
      description: "This API enables you to send targeted transactional SMS to your users. You can trigger these\
        \ SMS messages once a user takes a specific action on your platform.\n\nYou can use transactional SMS messages\
        \ to:\n\nSend a post-purchase SMS to share details about a purchase/booking,\n\nHelp your users reset their\
        \ password if they forget it,\n\nConfirm an order a user places,\n\nShare delivery tracking details of a\
        \ purchase (when it is shipped, on the way, and delivered) and take many other actions.\n\nUse Cases\nYou\
        \ can send transactional SMS messages for:\n\nSystem notifications\n\nOrder confirmation/information\n\n\
        Thank you for your purchase! Your order number is {orderNumber}. View more information about your order\
        \ here: {Link}\n\nHey, {firstName}! Thanks for your purchase! View more information about your order ({orderNumber})\
        \ here: {Link}\n\nShipping Confirmation\n\nGreat news, {firstName}! Your order ({orderNumber}) has shipped\
        \ and will arrive soon. Click here to view your order details: {Link}\n\nGet excited! Your order ({orderNumber})\
        \ has shipped and is on its way to you. Click here to view your order details: {Link}\n\nTicket booking\
        \ confirmation or cancellation\n\nHey {firstName}, order #{orderNumber} was successfully canceled. You can\
        \ check the status of your order here {Link}\n\nInformation about shipping and delivery updates\n\nRecurring\
        \ billing / Payment Updates\n\nAppointment confirmations\n\nWelcome Messages\n\nBody Parameters\nYou need\
        \ to use the following parameters in the request body.\n\nParameter\nDescription\nData Type\nRequired\n\n\
        to\nPhone Number\nString\nYes\n\ncontent\nContent of the SMS\nString\nYes\n\nunique_args\nUnique arguments\
        \ of transactional SMS used for tracking purposes\nObject\nNo\n\ncallback\nThe endpoint that you define\
        \ to receive the webhook events. If the response does not return a 200 (Success) code, the Insider system\
        \ will respond with \"Callback URL value is not valid\".\nURL\nNo\n\nsettings.UrlShorteningStatus\nFor using\
        \ the URL shortening for status in your messages.\nBoolean\nNo\n\nsettings.UrlShorteningDomain\nFor using\
        \ the URL shortening for your domain in your messages. e.g. insdr.io\nString\nNo\n\nsettings.UrlTrackingStatus\n\
        For using the URL click tracking in your messages. If you do not add this parameter to the payload, the\
        \ default version will not provide usage. If you do not open urlTracking and if you do not have Insider\
        \ Tag integration on the related link’s webpage you will see clickthrough metric under the analytics page\
        \ as zero.\nBoolean\nNo\n\nsettings.UrlExcludeProtocol\nFor excluding URL protocol (e.g., 'http://' or 'https://')\n\
        Boolean\nNo\n\nsendAt\nSpecifies the desired date and time at which the SMS message should be sent. For\
        \ example: datetime=2006-01-02T15:04:05Z  This parameter is valid only for Twilio and Sinch partners.\n\
        String\nNo\n\nSMS Status Callback\nThe current status of your SMS messages is provided to you through the\
        \ API URL you specify in the callback parameter while they are being sent. If you don't respond to code\
        \ between 200 and 300, the system retries the request 10 times. The retry policy process is as follows:\n\
        \nThe first request is tried again 1 minute later.\n\nThe second request is tried again 2 minutes later\
        \ after the first attempt.\n\nThe third request is tried again 3 minutes later after the first attempt.\n\
        \nThe fourth request is tried again 8 minutes later after the first attempt.\n\nThe fifth request is tried\
        \ again 13 minutes later after the first attempt.\n\nThe sixth request is tried again 18 minutes later after\
        \ the first attempt.\n\nThe seventh request is tried again 28 minutes later after the first attempt.\n\n\
        The eighth request is tried again 38 minutes later after the first attempt.\n\nThe ninth request is tried\
        \ again 48 minutes later after the first attempt.\n\nThe tenth request is tried again an hour later after\
        \ the first attempt.\n\nSample Body\nEvery request made to the request endpoint requires a request body\
        \ formatted in JSON and containing your sms content.\n\n{\n    \"content\": \"This is SMS body.\",\n   \
        \ \"to\": \"+105555555555\",\n    \"callback\": \"http://callback.url\",\n    \"sendAt\" : \"2024-03-30T11:30:27Z\"\
        ,\n    \"uniqueArgs\": {\n        \"additionalProp1\": \"string\",\n        \"additionalProp2\": \"string\"\
        ,\n        \"additionalProp3\": \"string\"\n    },\n    \"settings\": {\n        \"urlShorteningDomain\"\
        : \"insdr.io\",\n        \"urlShorteningStatus\": true,\n        \"urlTrackingStatus\": true\n    }\n}\n\
        \nMake sure to replace the sample values in the request header(s) and body where required before sending\
        \ your request.\n\nSample Responses\nAccepted\nThis response indicates that your request was successfully\
        \ completed.\n\n{\n    \"message\": \"Accepted\",\n    \"messageId\": \"sms-a1234567-b123-c123-d123-e123f123456\"\
        \n}\n\nSMS Sent\n{\n  \"id\": \"sms-a1234567-b123-c123-d123-e123f123456\",\n  \"uniqueArgs\": {\n    \"\
        additionalProp1\": \"string\",\n    \"additionalProp2\": \"string\",\n    \"additionalProp3\": \"string\"\
        \n  },\n  \"event\": \"sent\",\n  \"partCount\": 1\n}\n\nSMS Delivered\nThis response indicates that your\
        \ request was successfully completed.\n\n{\n  \"id\": \"sms-a1234567-b123-c123-d123-e123f123456\",\n  \"\
        uniqueArgs\": {\n    \"additionalProp1\": \"string\",\n    \"additionalProp2\": \"string\",\n    \"additionalProp3\"\
        : \"string\"\n  },\n  \"event\": \"delivered\"\n}\n\nSMS Undelivered\n{\n  \"id\": \"sms-a1234567-b123-c123-d123-e123f123456\"\
        ,\n  \"uniqueArgs\": {\n    \"additionalProp1\": \"string\",\n    \"additionalProp2\": \"string\",\n   \
        \ \"additionalProp3\": \"string\"\n  },\n  \"event\": \"undelivered\",\n  \"reason\": {\n        \"message\"\
        : \"Soft Bounce\",\n        \"code\": 1404\n    }\n}\n\nSMS Dropped\n{\n  \"id\": \"sms-a1234567-b123-c123-d123-e123f123456\"\
        ,\n  \"uniqueArgs\": {\n    \"additionalProp1\": \"string\",\n    \"additionalProp2\": \"string\",\n   \
        \ \"additionalProp3\": \"string\"\n  },\n  \"event\": \"failed\",\n  \"reason\": {\n    \"message\": \"\
        Invalid Phone Number\",\n    \"code\": 1500\n  },\n  \"partCount\": 1\n}\n\nSMS Scheduled\n{\n  \"id\":\
        \ \"sms-a1234567-b123-c123-d123-e123f123456\",\n  \"uniqueArgs\": {\n    \"additionalProp1\": \"string\"\
        ,\n    \"additionalProp2\": \"string\",\n    \"additionalProp3\": \"string\"\n  },\n  \"event\": \"scheduled\"\
        ,\n  \"sendAt\": \"2006-01-02T15:04:05Z\",\n  \"partCount\": 1\n}\n\nSMS Sent\n{\n  \"id\": \"sms-a1234567-b123-c123-d123-e123f123456\"\
        ,\n  \"uniqueArgs\": {\n    \"additionalProp1\": \"string\",\n    \"additionalProp2\": \"string\",\n   \
        \ \"additionalProp3\": \"string\"\n  },\n  \"event\": \"sent\",\n  \"sendAt\": \"2006-01-02T15:04:05Z\"\
        ,\n  \"partCount\": 1\n}\n\nLimitations\n\nAll functions must be executed with a simple HTTPS POST request.\n\
        \nThe API Key should be provided as the authorization key on the request header. If the key is incorrect,\
        \ the operation will not be executed and an authorization error will return in the response.\n\nTransactional\
        \ API cannot be used to send promotional SMS. It is designed to set transactional SMS only.\n\nThe phone\
        \ number should be in E164 format.\n\nContent can’t be empty. The maximum limit is 670 characters.\n\nThe\
        \ rate limit is 5 requests per second.\n\nThe maximum speed will be determined based on the Provider Setup.\n\
        \nInsider will send a sample request to the callback URL you provide. If the response does not return a\
        \ 200 (Success) code, the Insider system will respond with \"Callback URL value is not valid\"."
      security:
      - InsAuthKey: []
      requestBody:
        content:
          application/json:
            example:
              content: This is SMS body.
              to: '+105555555555'
              callback: http://callback.url
              sendAt: '2024-03-30T11:30:27Z'
              uniqueArgs:
                additionalProp1: string
                additionalProp2: string
                additionalProp3: string
              settings:
                urlExcludeProtocol: true
                urlShorteningDomain: insdr.io
                urlShorteningStatus: true
                urlTrackingStatus: true
                smartEncoding: true
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
