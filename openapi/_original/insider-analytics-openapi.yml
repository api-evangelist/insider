openapi: 3.1.0
info:
  title: Insider One Analytics API
  version: 1.0.0
  description: 'Email and OnSite campaign lists, campaign statistics and overall analytics.


    Derived by API Evangelist from Insider One''s own public Postman collection ("Insider One APIs", published at
    https://developers.insiderone.com/). Paths, methods, headers, query parameters and request/response examples
    are verbatim from that collection; nothing is invented. The 429 response is documented for all Insider One APIs
    on https://academy.insiderone.com/docs/api-rate-limits-1 .'
  contact:
    name: Insider One Support
    email: support@useinsider.com
    url: https://academy.insiderone.com/docs/insider-one-apis-1
  termsOfService: https://insiderone.com/terms-of-use/
externalDocs:
  description: Insider One API reference
  url: https://academy.insiderone.com/docs/api-reference-welcome
servers:
- url: https://analytics.api.useinsider.com
tags:
- name: Email
- name: OnSite
paths:
  /email/v1/campaign/list:
    get:
      operationId: getEmailCampaignList
      summary: Get email campaign list
      tags:
      - Email
      description: "This request allows you to get the analytics of your email campaigns for a given time period.\n\
        \nThe campaigns on the Draft and Scheduled statuses are not listed in the response. \n\nQuery Parameters\n\
        The following are the query parameters you need to use in your request.\n\nParameter\nData Type\nDescription\n\
        Required\n\npage\nInteger\nSpecifies the number of pages of email campaigns\nYes\n\nperPage\nInteger\nSpecifies\
        \ the number of emails to be listed per page\nYes\n\nBefore sending the request, make sure:\n\nTo replace\
        \ the authorization value with your own API key.\n\nTo replace the sample values in page and perPage with\
        \ your own values in the required data type.\n\nSample Responses\n200 OK\nThe following response returns\
        \ if the request is successful.\n\n{\n    \"currentPage\": 1,\n    \"data\": [\n        {\n            \"\
        id\": 67,\n            \"campaignName\": \"My awesome campaign\",\n            \"startTime\": \"01-01-2023\
        \ 12:30:15\"\n        },\n        {\n            \"id\": 66,\n            \"campaignName\": \"This is a\
        \ great campaign\",\n            \"startTime\": \"01-12-2022 09:30:17\"\n        },\n        {\n       \
        \     \"id\": 65,\n            \"campaignName\": \"This is a recurring campaign\",\n            \"startTime\"\
        : \"12-12-2022 12:45:15\"\n        },\n        {\n            \"id\": 64,\n            \"campaignName\"\
        : \"This is a newsletter\",\n            \"startTime\": \"22-07-2022 16:00:01\"\n        },\n        {\n\
        \            \"id\": 63,\n            \"campaignName\": \"My email campaign\",\n            \"startTime\"\
        : \"01-01-2022 18:30:00\"\n        }\n    ],\n    \"firstPageUrl\": \"https://analytics.useinsider.com/email/v1/campaign/list?page=1&perPage=5\"\
        ,\n    \"from\": 0,\n    \"lastPage\": 14,\n    \"lastPageUrl\": \"https://analytics.useinsider.com/email/v1/campaign/list?page=14&perPage=5\"\
        ,\n    \"nextPageUrl\": \"https://analytics.useinsider.com/email/v1/campaign/list?page=2&perPage=5\",\n\
        \    \"path\": \"/email/v1/campaign/list\",\n    \"perPage\": 5,\n    \"prevPageUrl\": \"https://analytics.useinsider.com/email/v1/campaign/list?page=1&perPage=5\"\
        ,\n    \"to\": 0,\n    \"total\": 67\n}\n\n400 Bad Request\nSorry, we’ve received an invalid request from\
        \ your side. You can try again later.\n\n400 Bad Request\nSorry, we couldn’t validate the request at the\
        \ moment. You can try again later.\n\n500 Internal Server Error\nSorry, we couldn’t receive any response\
        \ from our server. You can try again later.\n\nLimitations\nWhen sending your request, make sure to follow\
        \ these limitations:\n\nAll functions must be executed with an HTTPS GET request.\n\nThe x-ins-auth-key\
        \ should be provided as the authorization key on the request header. If the key is incorrect, the operation\
        \ will not be executed and an authorization error will return in the response.\n\nThis API provides data\
        \ for a 1 year-range.\n\nYou can send 1000 requests/per minute with the same API Key. If you exceed the\
        \ rate limit, you will receive a 429 error.\n\nThe perPage value should be between 1-100."
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: Integer
      - name: perPage
        in: query
        required: false
        schema:
          type: string
        example: Integer
      security:
      - InsAuthKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                currentPage: 2
                data:
                - id: 1084265
                  campaignName: Email 1
                  startTime: 05-05-2023 10:09:28
                - id: 1083699
                  campaignName: A great email campaign
                  startTime: 29-04-2023 14:05:04
                - id: 1083536
                  campaignName: My amazing email campaign
                  startTime: 27-04-2023 15:28:33
                - id: 1083532
                  campaignName: RSS Email
                  startTime: 27-04-2023 15:13:11
                - id: 1083530
                  campaignName: Email campaign
                  startTime: 27-04-2023 14:34:05
                firstPageUrl: https://analytics.useinsider.com/email/v1/campaign/list?page=1&perPage=5
                from: 5
                lastPage: 38
                lastPageUrl: https://analytics.useinsider.com/email/v1/campaign/list?page=38&perPage=5
                nextPageUrl: https://analytics.useinsider.com/email/v1/campaign/list?page=3&perPage=5
                path: /email/v1/campaign/list
                perPage: 5
                prevPageUrl: https://analytics.useinsider.com/email/v1/campaign/list?page=1&perPage=5
                to: 10
                total: 190
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /email/v1/campaign/statistics:
    get:
      operationId: getEmailCampaignAnalytics
      summary: Get email campaign analytics
      tags:
      - Email
      description: "This request allows you to get the analytics of your email campaigns for a given time period.\n\
        \nThe campaigns on the Draft and Scheduled statuses are not listed in the response. \n\nQuery Parameters\n\
        The following are the query parameters you need to use in your request.\n\nParameter\nData Type\nDescription\n\
        Required\n\ncampaignId\nInteger\nYour campaign ID that can be found on the campaign URL.\nYes\n\nstartTime\n\
        int64\nThe time campaign is being launched. Specifies a 10-digit epoch start time.\nYes\n\nendTime\nint64\n\
        The current date (today’s date on the payload). It can be customizable according to your use case. Specifies\
        \ a 10-digit epoch start time.\nNo\n\nIf the endTime value is empty, it will be populated with today’s date\
        \ and time in UTC. \n\nBefore sending the request, make sure:\n\nTo replace the authorization value with\
        \ your own API key.\n\nTo replace the sample values in campaignID, startTime, and endTime with your own\
        \ values in the required data type.\n\nSample Responses\n200 OK\nThe following response returns if the request\
        \ is successful.\n\n{\n    \"data\": {\n        \"details\": {},\n        \"summary\": {\n            \"\
        blocks\": 300,\n            \"bounces\": 0,\n            \"clickRate\": 1.45,\n            \"clickToOpen\"\
        : 2860,\n            \"conversion\": 22,\n            \"conversionRate\": 0.01,\n            \"delivered\"\
        : 235746,\n            \"frequencyDrop\": 0,\n            \"invalid\": 0,\n            \"linkActivities\"\
        : [\n            {\n                \"totalClick\": 1,\n                \"uniqueClick\": 1,\n          \
        \      \"url\": \"https://google.com\"\n            }\n        ],\n            \"machineOpen\": 0,\n   \
        \         \"openRate\": 6.48,\n            \"revenue\": 0,\n            \"sendingDrop\": 0,\n          \
        \  \"sent\": 236573,\n            \"spams\": 2,\n            \"systemDrop\": 0,\n            \"totalClick\"\
        : 4931,\n            \"totalOpen\": 64518,\n            \"uniqueClick\": 3429,\n            \"uniqueOpen\"\
        : 15272,\n            \"unsubscribes\": 100\n        }\n    }\n}\n\n400 Bad Request\nSorry, we’ve received\
        \ an invalid request from your side. You can try again later.\n\n400 Bad Request\nSorry, we couldn’t validate\
        \ the request at the moment. You can try again later.\n\n400 Bad Request\nSorry, we detected an invalid\
        \ Campaign ID in your request. The Campaign ID is not found in the database. You can confirm your Campaign\
        \ ID by checking the InOne panel.\n\n406 Not Acceptable Request\nSorry, we received an invalid request.\
        \ We are able to provide the analytics data for only the last 1 year.\n\n500 Internal Server Error\nSorry,\
        \ we couldn’t receive any response from our server. You can try again later.\n\nLimitations\nWhen sending\
        \ your request, make sure to follow these limitations.\n\nAll functions must be executed with an HTTPS GET\
        \ request.\n\nThe x-ins-auth-key should be provided as the authorization key on the request header. If the\
        \ key is incorrect, the operation will not be executed and an authorization error will return in the response.\n\
        \nThis API provides data for a 1 year-range.\n\nYou can send 100 requests/per minute with the same API Key.\
        \ If you exceed the rate limit, you will receive a 429 error.\n\nThe perPage value should be between 1-100."
      parameters:
      - name: campaignId
        in: query
        required: false
        schema:
          type: string
        example: integer
      - name: startTime
        in: query
        required: false
        schema:
          type: string
        example: int64
      security:
      - InsAuthKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                data:
                  details:
                    '4160':
                      blocks: 0
                      bounces: 0
                      clickRate: 0
                      clickToOpen: 0
                      conversion: 0
                      conversionRate: 0
                      delivered: 12
