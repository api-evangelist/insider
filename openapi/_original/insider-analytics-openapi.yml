        \ Parameters\nThe following are the query parameters you need to use in your request.\n\nParameter\nData\
        \ Type\nDescription\nRequired\n\nstartTime\nint64\nThe time campaign is being launched. Specifies a 10-digit\
        \ epoch start time.\nYes\n\nendTime\nint64\nThe current date (today’s date on the payload). It can be customizable\
        \ according to your case. Specifies a 10-digit epoch start time.\nNo\n\nBefore sending the request, make\
        \ sure:\n\nTo replace the authorization value with your own API key.\n\nTo replace the sample values in\
        \ start_date and end_date with your own values in the required data type.\n\nSample Responses\n200 OK\n\
        The following response returns if the request is successful.\n\n{\n    \"data\": {\n        \"summary\"\
        : {\n            \"blocks\": 0,\n            \"bounceDrop\": 0,\n            \"bounces\": 0,\n         \
        \   \"clickRate\": 5.88,\n            \"conversion\": 0,\n            \"conversionRate\": 0,\n         \
        \   \"delivered\": 17,\n            \"frequencyDrop\": 0,\n            \"invalid\": 0,\n            \"invalidDrop\"\
        : 0,\n            \"machineOpen\": 0,\n            \"openRate\": 47.05,\n            \"revenue\": 0,\n \
        \           \"sendingDrop\": 0,\n            \"sent\": 27,\n            \"spamDrop\": 0,\n            \"\
        spams\": 0,\n            \"systemDrop\": 0,\n            \"totalClick\": 1,\n            \"totalOpen\":\
