method: derived
source: >-
  Derived by binding Insider One's published MCP tool list
  (https://academy.insiderone.com/docs/insider-one-mcp-functions, captured in mcp/insider-mcp.yml)
  to the REST operationIds in openapi/, which were themselves derived from Insider One's own public
  Postman collection ("Insider One APIs", https://developers.insiderone.com/).
purpose: >-
  Make the MCP tool the first-class discovery unit and bind it to the REST operation that backs it.
  Insider One's MCP surface is an ANALYTICS + CONTENT-DRAFTING projection of a much larger REST
  estate: 35 tools against 113 REST operations. Every ingestion, sending, consent and catalog
  operation is REST-only by design — MCP cannot send a message, launch a campaign, modify a journey
  or write customer data.

surfaces:
  rest_openapi: openapi/            # 18 documents, 113 operations, 18 hosts — all *.useinsider.com
  postman: postman/insider-one-apis.postman_collection.json   # the first-party source, 138 requests
  mcp: https://mcp.insiderone.com/mcp                          # tools/list gated (401, OAuth 2.0)
  graphql: null                                                # Insider One publishes no GraphQL surface

confidence_note: >-
  The live MCP tools/list returns 401 unauthorized, so no tool inputSchema could be read. Rows below
  are bound by name and documented behaviour against the REST operation that serves the same data.
  A bound tool's REAL input schema is that operation's parameters + requestBody in openapi/.

