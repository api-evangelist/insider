limitations:
- Only documented tools are exposed; available tools depend on OAuth scopes and licensed channels.
- Write tools create drafts only — no sending, scheduling, launching or customer-data mutation.
- Journeys cannot be created or modified through MCP.
- OnSite analytics are not exposed through MCP.
- Existing Insider One API rate limits apply to MCP calls (see rate-limits/insider-rate-limits.yml).

