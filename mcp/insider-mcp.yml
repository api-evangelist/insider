summary: >-
  Insider One ships a first-party REMOTE MCP server at https://mcp.insiderone.com/mcp that exposes
  35 tools over the Insider One analytics, campaign and template surface. It is listed in the Claude
  Connectors directory (no-code install) and reachable from any MCP client via `npx mcp-remote`.
  Authentication is OAuth 2.0 (Client ID + Client Secret generated in the InOne panel, per-channel
  scopes chosen at credential-generation time); the authorization server is https://gw.useinsider.com
  and it publishes RFC 8414 + RFC 9728 discovery documents.

deployment:
  mode: remote
  endpoint: https://mcp.insiderone.com/mcp
  install: 'npx -y mcp-remote https://mcp.insiderone.com/mcp --header "Authorization: Bearer YOUR_ACCESS_TOKEN"'
  package: null
  auth: oauth
  verified: probed
  note: >-
    mcp-remote is the generic Cloudflare/community bridge, not an Insider-published package — the
    product Insider ships is the hosted HTTP endpoint, so mode is `remote`, not `both`. Claude
    Desktop installs it from the Connectors directory with no local component at all.

server:
  name: insider-one-mcp
  transport: http
  url: https://mcp.insiderone.com/mcp
  listings:
  - Claude Connectors directory ("Insider One")
  tool_count: 35
  read_only_tools: 28
  write_tools: 7
  write_semantics: >-
    Write tools create DRAFTS in the InOne panel only. They never send, schedule or publish. Every
    write action defaults to "Needs approval" in the client. Journeys and customer data cannot be
    modified through MCP.

auth:
  methods:
  - oauth2
  oauth2:
    issuer: https://gw.useinsider.com
    authorization_endpoint: https://gw.useinsider.com/oauth2/authorize
    token_endpoint: https://gw.useinsider.com/oauth2/token
    revocation_endpoint: https://gw.useinsider.com/oauth2/revoke
    grant_types:
    - authorization_code
    - refresh_token
    - client_credentials
    pkce:
    - S256
    token_lifetime: up to 90 minutes
    credential_source: InOne panel > Settings > InOne Settings > Integration Settings > OAuth 2.0 Credentials
    scope_model: per-channel scopes selected when the credential is generated; a tool is available only
      if the credential carries the matching scope
    discovery:
    - well-known/insider-gw-oauth-authorization-server.json
    - well-known/insider-mcp-oauth-protected-resource.json
    ref: scopes/insider-scopes.yml

